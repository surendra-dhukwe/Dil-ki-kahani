<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Real Diya System</title>

<style>
body{
 margin:0;
 height:100vh;
 background:#f6ead1;
 overflow:hidden;
 transition:0.5s;
}

/* DIYA */
.diya{
 position:absolute;
 width:50px;height:50px;
 cursor:pointer;
 opacity:0.6;
 transition:0.3s;
}
.diya.active{opacity:1;transform:scale(1.15);}

.bowl{
 position:absolute;
 bottom:0;
 width:50px;height:22px;
 background:linear-gradient(#d58a3a,#5a2e0c);
 border-radius:0 0 30px 30px;
}

/* FLAME */
.flame{
 position:absolute;
 bottom:20px;left:50%;
 transform:translateX(-50%);
 width:8px;height:18px;
 background:radial-gradient(circle,#fff,#ffd700,#ff6a00);
 border-radius:50%;
 animation:flicker 0.12s infinite;
 box-shadow:0 0 20px orange,0 0 40px red;
}
.flame.off{display:none;}

@keyframes flicker{
 50%{transform:translateX(-50%) scaleY(1.7);}
}

/* POS */
.tl{top:10px;left:10px;}
.tr{top:10px;right:10px;}
.bl{bottom:10px;left:10px;}
.br{bottom:10px;right:10px;}

/* DARK / DAY */
.dark{background:#02030a;}
.day{background:#87ceeb;}

/* MOON */
.moon{
 position:fixed;
 top:10%;right:15%;
 width:40px;height:40px;
 background:#eee;
 border-radius:50%;
 box-shadow:0 0 25px #fff;
}

/* STARS */
.star{
 position:fixed;
 width:2px;height:2px;
 background:white;
 animation:twinkle 2s infinite;
}
@keyframes twinkle{50%{opacity:0.2;}}

/* SUN (FIXED POSITION) */
.sun{
 position:fixed;
 top:10%;
 right:15%;
 width:45px;height:45px;
 background:yellow;
 border-radius:50%;
 box-shadow:0 0 60px orange;
}

/* CLOUD */
.cloud{
 position:fixed;
 top:0;
 width:100%;
 height:120px;
 display:flex;
 gap:20px;
 animation:cloudMove 20s linear infinite;
}
@keyframes cloudMove{
 from{transform:translateX(-10%);}
 to{transform:translateX(10%);}
}

.cloud-piece{
 width:90px;height:40px;
 background:#dcdcdc;
 border-radius:50px;
 position:relative;
}
.cloud-piece::before,
.cloud-piece::after{
 content:"";
 position:absolute;
 background:#dcdcdc;
 border-radius:50%;
}
.cloud-piece::before{width:50px;height:50px;top:-20px;left:10px;}
.cloud-piece::after{width:40px;height:40px;top:-15px;right:10px;}

/* RAIN */
.rain{
 position:fixed;
 width:2px;height:14px;
 background:#9ecfff;
 animation:rain 0.7s linear infinite;
}
@keyframes rain{
 to{transform:translateY(100vh);}
}

/* LIGHTNING */
.lightning{
 position:fixed;
 width:100%;height:100%;
 background:white;
 opacity:0;
 pointer-events:none;
}

 /* 🌫️ FOG */
.fog{
 position:fixed;
 width:200%;
 height:100%;
 background:rgba(255,255,255,0.05);
 animation:fogMove 20s linear infinite;
}

@keyframes fogMove{
 from{transform:translateX(-10%);}
 to{transform:translateX(10%);}
}

/* 💧 RAIN SPLASH */
.splash{
 position:fixed;
 width:6px;height:2px;
 background:#9ecfff;
 bottom:0;
 opacity:0.6;
 animation:splash 0.5s linear infinite;
}

@keyframes splash{
 0%{transform:scaleX(0);}
 100%{transform:scaleX(1.5);opacity:0;}
}

/* ☀️ HEAT WAVE */
.heat-wave{
 position:fixed;
 width:100%;
 height:100%;
 background:linear-gradient(
   transparent,
   rgba(255,140,0,0.05),
   transparent
 );
 animation:heatWave 3s infinite;
 pointer-events:none;
}

@keyframes heatWave{
 0%{transform:translateY(0);}
 50%{transform:translateY(-5px);}
 100%{transform:translateY(0);}
}
 
 /* 🔥 FIX: sab effects click block na kare */
.rain, .fog, .cloud, .lightning, .splash, .reflection {
 pointer-events: none;
}

/* 🪔 DIYA always on top */
.diya{
 z-index: 9999;
}
</style>
</head>

<body>

<!-- AUDIO -->
<audio id="nightSound" loop src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3"></audio>
<audio id="daySound" loop src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_6b58c3e9c4.mp3"></audio>
<audio id="rainSound" loop src="https://cdn.pixabay.com/download/audio/2021/09/06/audio_8b6d563c2d.mp3"></audio>

<!-- DIYAS -->
<div class="diya tl" onclick="toggleDark(this)">
 <div class="flame"></div><div class="bowl"></div>
</div>

<div class="diya tr" onclick="toggleMoon(this)">
 <div class="flame"></div><div class="bowl"></div>
</div>

<div class="diya bl" onclick="toggleSun(this)">
 <div class="flame"></div><div class="bowl"></div>
</div>

<div class="diya br" onclick="toggleRain(this)">
 <div class="flame"></div><div class="bowl"></div>
</div>


<script>

let activeMode=null;
let lightningTimeout=null;

/* AUDIO */
const nightSound=document.getElementById('nightSound');
const daySound=document.getElementById('daySound');
const rainSound=document.getElementById('rainSound');
const thunder=new Audio("https://cdn.pixabay.com/download/audio/2022/03/15/audio_4b9b5c4c9f.mp3");

/* STOP AUDIO */
function stopAllAudio(){
 [nightSound,daySound,rainSound,thunder].forEach(a=>{
  a.pause();
  a.currentTime=0;
 });
}

/* 🔥 MASTER RESET (MOST IMPORTANT FIX) */
function resetAll(){

 // remove all effects
 document.querySelectorAll(
  '.moon,.sun,.cloud,.rain,.star,.lightning,.fog,.splash,.heat-wave,.reflection,.shooting-star'
 ).forEach(e=>e.remove());

 // reset diya
 document.querySelectorAll('.diya').forEach(d=>{
  d.classList.remove('active');
  d.style.boxShadow="none";
 });

 // flame on
 document.querySelectorAll('.flame').forEach(f=>f.classList.remove('off'));

 // reset body FULL
 document.body.classList.remove('dark','day');
 document.body.style.background="";
 document.body.style.filter="none";
 document.body.style.backdropFilter="none";

 stopAllAudio();
 clearTimeout(lightningTimeout);

 activeMode=null;
}

/* DIYA GLOW */
function addDiyaGlow(){
 document.querySelectorAll('.diya').forEach(d=>{
  d.style.boxShadow="0 0 40px orange,0 0 80px rgba(255,150,0,0.4)";
 });
}

/* 🪔 1st DIYA (TOGGLE DARK/LIGHT) */
function toggleDark(el){

 if(document.body.classList.contains('dark')){
  resetAll();
  document.body.classList.add('day');
 }else{
  resetAll();
  document.body.classList.add('dark');

  el.classList.add('active');
  addDiyaGlow();
 }
}

/* 🌙 MOON (FORCE DARK) */
function toggleMoon(el){

 if(activeMode==='moon'){ resetAll(); return; }

 resetAll();
 activeMode='moon';

 document.body.classList.add('dark');

 el.classList.add('active');
 addDiyaGlow();

 let m=document.createElement('div');
 m.className='moon';
 document.body.appendChild(m);

 for(let i=0;i<80;i++){
  let s=document.createElement('div');
  s.className='star';
  s.style.left=Math.random()*100+'vw';
  s.style.top=Math.random()*100+'vh';
  document.body.appendChild(s);
 }

 nightSound.play();
}

/* ☀️ SUN (FORCE DAY) */
function toggleSun(el){

 if(activeMode==='sun'){ resetAll(); return; }

 resetAll();
 activeMode='sun';

 document.body.classList.add('day');
 document.body.style.background="#87ceeb";

 el.classList.add('active');

 let s=document.createElement('div');
 s.className='sun';
 document.body.appendChild(s);

 let heat=document.createElement('div');
 heat.className='heat-wave';
 document.body.appendChild(heat);

 addDiyaGlow();
 daySound.play();
}

/* 🌧️ RAIN (FORCE DARK + STORM) */
function toggleRain(el){

 if(activeMode==='rain'){ resetAll(); return; }

 resetAll();
 activeMode='rain';

 document.body.classList.add('dark');
 document.body.style.background="#000814";

 el.classList.add('active');

 // diya off
 document.querySelectorAll('.flame').forEach(f=>f.classList.add('off'));

 // fog
 let fog=document.createElement('div');
 fog.className='fog';
 document.body.appendChild(fog);

 // reflection
 let ref=document.createElement('div');
 ref.className='reflection';
 ref.style.position="fixed";
 ref.style.bottom="0";
 ref.style.width="100%";
 ref.style.height="120px";
 ref.style.background="linear-gradient(transparent,rgba(0,0,0,0.6))";
 document.body.appendChild(ref);

 // clouds
 let cloud=document.createElement('div');
 cloud.className='cloud';
 document.body.appendChild(cloud);

 for(let i=0;i<10;i++){
  let c=document.createElement('div');
  c.className='cloud-piece';
  cloud.appendChild(c);
 }

 // rain
 for(let i=0;i<180;i++){
  let r=document.createElement('div');
  r.className='rain';
  r.style.left=Math.random()*100+'vw';
  r.style.animationDuration=(0.3+Math.random())+'s';
  document.body.appendChild(r);
 }

 // splash
 for(let i=0;i<80;i++){
  let s=document.createElement('div');
  s.className='splash';
  s.style.left=Math.random()*100+'vw';
  document.body.appendChild(s);
 }

 // lightning
 let l=document.createElement('div');
 l.className='lightning';
 document.body.appendChild(l);

 function storm(){

  if(activeMode!=='rain') return;

  l.style.opacity=Math.random();

  thunder.currentTime=0;
  thunder.play();

  setTimeout(()=>l.style.opacity=0,80);

  lightningTimeout=setTimeout(storm,1500+Math.random()*3000);
 }

 storm();

 rainSound.play();
}

</script>
</body>
</html>
